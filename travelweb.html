<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Travel Location Finder</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
    }

    header{
      background:#0d6efd;
      color:white;
      padding:15px;
      text-align:center;
    }

    .search-box{
      width:90%;
      max-width:500px;
      margin:20px auto;
      display:flex;
      gap:10px;
    }

    .search-box input{
      flex:1;
      padding:12px;
      border:none;
      border-radius:8px;
      font-size:16px;
    }

    .search-box button{
      padding:12px 18px;
      border:none;
      background:#0d6efd;
      color:white;
      border-radius:8px;
      cursor:pointer;
    }

    .places{
      width:90%;
      margin:20px auto;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:15px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
      text-align:center;
    }

    .card h3{
      margin-bottom:10px;
      color:#333;
    }

    .card p{
      color:#666;
      margin-bottom:15px;
    }

    .card button{
      background:#198754;
      color:white;
      border:none;
      padding:10px 15px;
      border-radius:8px;
      cursor:pointer;
    }

    footer{
      text-align:center;
      padding:15px;
      background:#222;
      color:white;
      margin-top:30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Travel Location Finder</h1>
    <p>Find nearby important places easily</p>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search place...">
    <button onclick="searchPlace()">Search</button>
  </div>

  <div class="places">

    <div class="card">
      <h3>🏨 Hotels</h3>
      <p>Find nearby hotels</p>
      <button onclick="openMap('hotel')">Open Map</button>
    </div>

    <div class="card">
      <h3>⛽ Petrol Pump</h3>
      <p>Find fuel stations</p>
      <button onclick="openMap('petrol pump')">Open Map</button>
    </div>

    <div class="card">
      <h3>🏥 Hospital</h3>
      <p>Emergency hospitals nearby</p>
      <button onclick="openMap('hospital')">Open Map</button>
    </div>

    <div class="card">
      <h3>🍴 Restaurant</h3>
      <p>Best restaurants near you</p>
      <button onclick="openMap('restaurant')">Open Map</button>
    </div>

  </div>

  <footer>
    Travel Finder Website © 2026
  </footer>

  <script>

    function openMap(place){
      const url = https://www.google.com/maps/search/${place};
      window.open(url, "_blank");
    }

    function searchPlace(){
      let place = document.getElementById("searchInput").value;

      if(place === ""){
        alert("Please enter a place");
      } else {
        openMap(place);
      }
    }

  </script>

</body>
</html>
